# Purpose:   Take NetworkManager out of the DNS path completely.
# Scope:     The NetworkManager daemon, all connections.
# Requires:  Nothing. Works with any locally installed resolver.
# Reference: NetworkManager.conf(5), [main] section.
#
# NetworkManager still learns the name servers offered by DHCP and by IPv6
# router advertisements, but it never applies them anywhere. /etc/resolv.conf
# is left to the administrator: point it at your local resolver yourself,
# using a static file or a symlink.

[main]

# Do not write /etc/resolv.conf, and turn off NetworkManager's own DNS handling.
dns=none

# Do not hand per-link name servers to systemd-resolved over D-Bus. This is the
# only other way NetworkManager can set DNS while systemd-resolved is running,
# so NetworkManager's own VPN plugins will connect but their DNS servers will
# be ignored. Tools that set DNS without going through NetworkManager, such as
# wg-quick or Tailscale, keep working.
systemd-resolved=false
