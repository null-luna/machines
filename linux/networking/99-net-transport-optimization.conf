# =====================================================================
# 99-net-transport-optimization.conf
# Transport tuning for Fedora Linux 44 KDE
#
# Client stack: Cloudflare WARP (MASQUE/QUIC, tunnel-only) on the wire,
#               dnscrypt-proxy (DoH3/QUIC + fallback) for DNS.
# =====================================================================
# BASELINE
#   Fedora Linux 44, kernel 7.2.x, tuned `balanced` profile. The three
#   baseline dumps this file was checked against were captured on
#   7.1.9-200.fc44.x86_64; every judgement below is made against
#   7.2.5-200.fc44.x86_64, which is what the machines run.
#   Every "default:" quoted below is the running value observed on that
#   baseline. Where that observed value is also the upstream kernel
#   default, the comment now says so explicitly -- an earlier revision
#   of this file assumed several of them were distro overrides and was
#   wrong on all four counts (see ORDERING).
#   Most lines here raise a ceiling or swap an algorithm. Five do not:
#   tcp_slow_start_after_idle, tcp_notsent_lowat and the three keepalive
#   values are deliberately set LOWER than baseline, each for the reason
#   given in its own section. Delete the file and the system is back to
#   baseline exactly.
#
# SCOPE
#   One file for both machines, and for any future machine. Everything
#   that actually differed between desktop and laptop is computed by
#   the kernel (tcp/udp_mem, CPU-bitmap widths, conntrack counters) and
#   must not be pinned from a file. The ceilings chosen here are trivial
#   against any modern amount of RAM and sized for any WAN up to
#   ~2.5 Gbit. One line -- tcp_rmem in section 5 -- deliberately pins a
#   value the kernel would otherwise size from RAM; its section says why
#   and what the floor is.
#
# INITRAMFS
#   The initramfs carries a copy of this file. Run `sudo dracut --force`
#   after every edit.
#
# ORDERING
#   tuned applies its profile after systemd-sysctl at boot.
#   CORRECTION, verified against 7.2: the four keys this file used to
#   cite as evidence that "something downstream manages them" are all
#   plain upstream kernel defaults on 7.2, not distro overrides --
#     net.ipv4.tcp_rmem  4096 131072 33554432
#       ip-sysctl.rst (v7.2): tcp_rmem max is "between 131072 and 32MB,
#       depending on RAM size". At v6.12 the same line read "between
#       131072 and 6MB"; the cap was raised upstream between those two
#       releases. 32 MiB is what a 24/32 GiB machine computes.
#     net.core.rmem_max / net.core.wmem_max  4194304
#       net/core/sock.c (v7.2): `__u32 sysctl_rmem_max = 4 << 20;` and
#       the same for wmem. Documentation/admin-guide/sysctl/net.rst
#       (v7.2) states "Default: 4194304" for both. The 212992 figure
#       people remember is long gone upstream.
#     net.ipv4.tcp_ecn  2
#       ip-sysctl.rst (v7.2): "Default: 2". See section 3.
#   So there is no evidence in the dumps that any downstream layer
#   manages transport sysctls at all. The tuned warning below stands as
#   a precaution, not as a conclusion:
#   A distro sysctl fragment cannot clobber this file -- the 99- prefix
#   sorts after the distro's fragments -- but tuned runs later and can.
#   If any value below reads back wrong after a full reboot (see VERIFY
#   at the bottom), tuned is re-overriding it: mirror the value in a
#   tuned profile override instead of fighting it from sysctl.d.

# ---------------------------------------------------------------------
# 1. Congestion control + pacing
# ---------------------------------------------------------------------
# default: net.core.default_qdisc = fq_codel  (Fedora; the upstream
#          kernel default is pfifo_fast)
#          net.ipv4.tcp_congestion_control = cubic
# here   : fq + bbr
#
# Both are modules and neither is in the initrd, so the "-" prefix
# quiets the expected early-boot write failure. The post-switch-root
# pass applies them for real, and writing the names autoloads tcp_bbr
# and sch_fq -- which is why the baseline shows only
# net.ipv4.tcp_available_congestion_control = reno cubic; nothing had
# asked for bbr yet.
#
# BBR measures the path's actual bandwidth and RTT instead of backing
# off on every loss, so it holds throughput on the long, occasionally
# lossy inner paths behind the MASQUE tunnel where cubic collapses.
# fq supplies per-flow pacing, which is how BBR expects to be driven.
#
# The `bbr` selected here is BBRv1 and will stay BBRv1 for the whole
# 7.2 series -- mainline has no BBRv3. Section 8 covers what changes if
# that ever stops being true.
#
# net.ipv4.tcp_allowed_congestion_control (baseline: "reno cubic") is a
# different key from tcp_available_congestion_control and needs no
# action here. Verified against v7.2 net/ipv4/tcp_cong.c:
#   - The string is generated from the TCP_CONG_NON_RESTRICTED flag on
#     each registered algorithm, and it gates exactly one thing:
#     setsockopt(TCP_CONGESTION) issued by an unprivileged process.
#   - It does NOT gate the sysctl write on the line below.
#     tcp_set_default_congestion_control() does no restricted check; it
#     autoloads the module and then does `ca->flags |=
#     TCP_CONG_NON_RESTRICTED` -- the default is always allowed.
#   - So it self-updates: once bbr is the default, this key reads
#     "reno cubic bbr" without anyone writing to it. (tcp_bbr.c also
#     declares TCP_CONG_NON_RESTRICTED on its own, so merely autoloading
#     the module would have been enough.)
#   The baseline reading "reno cubic" is simply reno plus whatever
#   tcp_congestion_control was at the time, which is what the v7.2
#   documentation says to expect.
-net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr

# ---------------------------------------------------------------------
# 2. Latency on live connections
# ---------------------------------------------------------------------
# default: net.ipv4.tcp_slow_start_after_idle = 1 (also the upstream
#          kernel default)
# here   : 0 -- keep cwnd across idle gaps.
# HTTP/2- and HTTP/3-era connections are long-lived and bursty, and
# re-running slow start after every 200 ms pause is pure added latency.
# The restart bursts are absorbed by fq pacing.
# Scope note, since section 1 selects BBR: BBR recomputes cwnd from its
# own bandwidth x min_rtt model on every ACK, so the reduction that
# tcp_cwnd_restart() applies is overwritten within about one RTT. On a
# boot where tcp_bbr actually loaded this line is close to inert. It is
# kept because the "-" prefix in section 1 means a failed module load
# leaves the system on cubic silently, and on cubic this line is the
# whole point.
net.ipv4.tcp_slow_start_after_idle = 0

# default: net.ipv4.tcp_notsent_lowat = 4294967295 (UINT_MAX, the
#          upstream kernel default -- effectively no cap)
# here   : 131072 -- cap unsent bytes queued in the socket at 128 KiB.
# Uploads stop hiding seconds of data inside the send buffer, so
# interactive traffic sharing the link stays snappy. 128 KiB is the safe
# consensus value; it applies to loopback too, where the cost is
# unmeasurable at these speeds.
# Hosts serving HTTP media SHOULD raise this ceiling. The sender is
# permitted one threshold-sized write per writability notification, so
# throughput is bounded by the notification interval rather than by the
# path; at 128 KiB it falls below 4K delivery and playback fails to
# start.
net.ipv4.tcp_notsent_lowat = 131072

# ---------------------------------------------------------------------
# 3. ECN
# ---------------------------------------------------------------------
# default: net.ipv4.tcp_ecn = 2 -- accept Classic ECN on incoming
#          connections, request nothing outbound.
#          CORRECTED: 2 is the UPSTREAM kernel default on 7.2, not a
#          Fedora pin. ip-sysctl.rst at v7.2 still reads "Default: 2",
#          exactly as it did at v6.12. What the AccECN work changed was
#          the ladder, not the default: v6.12 documented values 0-2
#          only, v7.2 documents 0-5. An earlier revision of this file
#          claimed the upstream default became 5 in the 7.0 series and
#          that the distro was restoring a pre-7.0 stance. Both halves
#          of that were wrong; nothing downstream is pinning this.
# here   : 1 -- also request Classic ECN on outgoing connections.
#
# This kernel accepts 0 through 5. The value sets the highest ECN
# variant attempted in each direction; the handshake then settles on
# the highest variant both peers support, falling back to Classic ECN
# or to no ECN as needed. Ladder confirmed verbatim against
# Documentation/networking/ip-sysctl.rst at v7.2:
#
#   0  incoming: none      outgoing: none
#   1  incoming: Classic   outgoing: Classic    <- set here
#   2  incoming: Classic   outgoing: none       <- default
#   3  incoming: AccECN    outgoing: AccECN
#   4  incoming: AccECN    outgoing: Classic
#   5  incoming: AccECN    outgoing: none
#
# Requesting outbound is the point: an ECN-capable bottleneck marks
# packets instead of dropping them, and a packet that is not dropped is
# a retransmission and possibly an RTO that never happens.
#
# Two limits on that benefit, both worth stating plainly because the
# earlier wording oversold it:
#
#   - The bottleneck most likely to matter is the local access link,
#     and inner ECN cannot see it. WARP carries the inner IP packets
#     with their ECN codepoints intact, so marking works between
#     Cloudflare's egress and the real origin. But congestion on the
#     segment between this host and Cloudflare is congestion on the
#     OUTER QUIC flow; it is the WARP client's own congestion
#     controller that sees it, and inner TCP only ever perceives it as
#     tunnel RTT or tunnel loss. ECN buys nothing on that hop.
#
#   - With BBRv1 the sender's response to a mark is close to nothing.
#     net/ipv4/tcp_bbr.c at v7.2 contains no ECN handling whatsoever,
#     and BBR resets cwnd from its own model on every ACK, so the CWR
#     reduction a CE mark triggers is overwritten almost immediately.
#     The win above (drop avoided) is real and is independent of that;
#     the fairness cost is that this host does not slow down at an
#     ECN-marking bottleneck the way an RFC 3168 sender would. On a
#     two-machine client stack that is an acceptable trade. It is also
#     the reason section 8 reverses this setting for BBRv3.
#
# 1 rather than 3 is deliberate. Classic ECN has decades of deployment
# behind it; Accurate ECN is new enough on the wire that its middlebox
# exposure is not yet established, and the AccECN options are the part
# most likely to be stripped in transit. 3, or 4 which upgrades only
# the incoming side, is the upgrade path once that picture is clearer.
# Negotiation downgrades on its own, so neither is risky in principle,
# only unproven -- and note that neither matches any upstream default,
# since upstream sits at 2.
#
# Blackhole risk is the historical objection to requesting ECN at all;
# it is negligible on the modern Internet (mainstream operating
# systems have requested ECN by default for years), and the baseline's
# net.ipv4.tcp_ecn_fallback = 1 retries without ECN if a SYN dies. Set
# this back to 2 if some exotic middlebox ever disagrees.
net.ipv4.tcp_ecn = 1

# ---------------------------------------------------------------------
# 4. Path-MTU blackhole recovery
# ---------------------------------------------------------------------
# default: net.ipv4.tcp_mtu_probing = 0 (off)
#          net.ipv4.tcp_mtu_probe_floor = 48
#          both are the upstream kernel defaults
# here   : probing armed, floor raised to 1024.
# "Armed", not "on": at value 1 the kernel documentation is precise --
# "Disabled by default, enabled when an ICMP black hole detected".
# Value 2 is the always-on setting and is not wanted here, because on a
# healthy path PLPMTUD probing is wasted work.
# The MASQUE tun runs at a reduced MTU, and ICMP "frag needed" is the
# first thing broken paths eat. Probing detects the blackhole and walks
# the MSS down instead of hanging the connection; the higher floor keeps
# the search from degenerating all the way down to 48 bytes.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_mtu_probe_floor = 1024

# ---------------------------------------------------------------------
# 5. Buffer ceilings (nothing is preallocated)
# ---------------------------------------------------------------------
# default: net.core.rmem_max = 4194304 (4 MiB)
#          net.core.wmem_max = 4194304 (4 MiB)
#          both are the upstream kernel defaults on 7.2, not Fedora's
#          doing: net/core/sock.c has `sysctl_rmem_max = 4 << 20`.
# here   : 16777216 (16 MiB) for both.
# These gate what applications may request via setsockopt, and this
# stack is QUIC three times over: the WARP client, dnscrypt-proxy's
# DoH3 (quic-go-class stacks want >= ~7.5 MB and warn below it), and
# every browser's HTTP/3. 4 MiB is the actual choke point; 16 MiB gives
# all of them headroom. Memory cost is zero until a socket really
# buffers that much.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# default: net.ipv4.tcp_wmem = 4096 16384 4194304 (send-autotune max
#          4 MiB)
# here   : 4096 16384 33554432 -- send-autotune max raised to 32 MiB,
#          min and default unchanged.
#
# PROVENANCE OF THE STARTING POINT (it does not change the decision).
# machine-derived.txt excluded tcp_wmem as ambiguous, because the
# kernel computes [2] as min(4 MiB, a RAM-derived limit) and 4194304 is
# exactly that 4 MiB cap, so the dumps cannot tell a tuned setting from
# a kernel computation. The v7.2 documentation confirms the mechanism
# --  "Default: between 64K and 4MB, depending on RAM size" -- and both
# machines are far past the point where the RAM term stops binding.
# The ambiguity is therefore about WHO set 4 MiB, never about WHETHER
# the starting point is 4 MiB: that is observed, identically, on two
# machines. Everything below rests on the value, not on its origin, so
# raising it stands.
# The one thing provenance would change is ORDERING: if tuned owns
# tcp_wmem it can overwrite this line after boot, which is exactly what
# the VERIFY block at the bottom is for.
# What would settle it, in increasing order of effort:
#   grep -rn tcp_wmem /usr/lib/sysctl.d /etc/sysctl.d /run/sysctl.d \
#                     /usr/lib/tuned /etc/tuned
#   -- no hit means nothing configures it and the kernel computed it;
#   a hit names the owner outright.
#   Failing that, `systemctl stop tuned` then re-read the key, or read
#   it from an initrd emergency shell before any userspace profile has
#   run.
#
# It is the single-flow upload ceiling: 4 MiB caps one flow at about
# 320 Mbit/s at 100 ms RTT, and 32 MiB removes the cap for any
# realistic line. With BBR pacing and notsent_lowat above, a big buffer
# no longer means a bloated one.
net.ipv4.tcp_wmem = 4096 16384 33554432

# default: net.ipv4.tcp_rmem = 4096 131072 33554432 (receive-autotune
#          max 32 MiB)
# here   : identical values, but PINNED rather than inherited.
# This line is new, and it overturns this file's previous "deliberately
# NOT set" entry for tcp_rmem. That entry said the 32 MiB max "is
# already set downstream" and that restating it would fight future
# profile edits. The premise was wrong: v7.2 documents tcp_rmem[2] as
# "between 131072 and 32MB, depending on RAM size", so 33554432 is the
# kernel's own ceiling, reached because 24 and 32 GiB machines saturate
# the RAM term. Nothing downstream owns it and there is no profile edit
# to fight.
# That matters for SCOPE. A future machine with a small amount of RAM
# computes a LOWER tcp_rmem[2] and silently loses the receive-side
# headroom that section 5 assumes, while still getting the 32 MiB send
# ceiling from the line above -- an asymmetry that would be invisible
# until a download underperformed. Pinning both sides makes the file
# say what it means.
# Trade-off, stated plainly: this is the one value here that overrides
# a kernel sizing decision rather than a kernel default. On a host with
# very little RAM the kernel would have chosen less on purpose. The
# backstop is net.ipv4.tcp_mem, which is RAM-sized, is not pinned by
# this file, and still caps aggregate TCP memory no matter what any
# single socket is allowed to autotune to. Drop this line on anything
# under a couple of GiB.
net.ipv4.tcp_rmem = 4096 131072 33554432

# ---------------------------------------------------------------------
# 6. Liveness through the tunnel
# ---------------------------------------------------------------------
# default: net.ipv4.tcp_keepalive_time = 7200 (first probe after 2 h)
#          net.ipv4.tcp_keepalive_intvl = 75
#          net.ipv4.tcp_keepalive_probes = 9
#          all three are the upstream kernel defaults
# here   : 600 / 60 / 6 -- first probe after 10 min, dead peer declared
#          in 16 min instead of about 2.2 h.
# Long-idle inner TCP flows traverse Cloudflare's egress NAT, and a
# first keepalive at 2 hours is far too late to keep that state alive.
# This applies only to sockets that enable SO_KEEPALIVE; a few packets
# per idle flow per 10 min is nothing, including on battery.
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 6

# ---------------------------------------------------------------------
# 7. Thin-stream retransmit latency
# ---------------------------------------------------------------------
# default: net.ipv4.tcp_thin_linear_timeouts = 0 (off; upstream kernel
#          default, and the baseline agrees)
# here   : 1 -- linear, not exponential, RTO backoff while a stream is
#          thin.
# A stream is "thin" when it has fewer than 4 packets in flight, which
# on this host means SSH, the interactive half of an HTTP/2 connection,
# chat and sync clients, and the control traffic of everything else.
# Thin streams cannot trigger fast retransmit -- there are not enough
# packets in flight to generate the duplicate ACKs -- so every loss
# costs a full RTO, and the standard exponential backoff turns a second
# loss into a multi-second stall. Over a tunnel with a fluctuating RTT
# that is the stall users actually notice.
# With this on, the kernel performs up to 6 linear-spaced timeouts
# while the stream stays thin before falling back to exponential
# backoff.
# Trade-off: it is more aggressive than the RFC baseline, and on a host
# with thousands of thin streams that aggression aggregates into real
# extra load. That is a server's problem, not this one's -- two client
# machines with tens of thin streams each.
# No periodic or idle cost: the check runs only on an RTO that has
# already fired, so an idle or battery-powered machine sends nothing
# extra.
net.ipv4.tcp_thin_linear_timeouts = 1

# ---------------------------------------------------------------------
# 8. BBRv3 -- NOT AVAILABLE ON THIS SYSTEM (entire section inert)
# ---------------------------------------------------------------------
# Every line in this section is a comment. Nothing here is applied.
#
# STATUS, established from sources on 2026-09-12 (not from this host):
#
#   NOT in mainline. net/ipv4/tcp_bbr.c at tag v7.2, and on
#   torvalds/master today, is still BBRv1: there is no BBR_VERSION
#   constant, no MODULE_VERSION, no CE or ECN handling of any kind, and
#   no L4S code. So the `bbr` section 1 selects is BBRv1 for the whole
#   7.2 series.
#
#   Still out-of-tree. The usable tree is google/bbr, branch v3 (last
#   updated March 2025), which carries `#define BBR_VERSION 3`,
#   MODULE_VERSION(__stringify(BBR_VERSION)), and the sender-side ECN
#   machinery described below. A separate tree, L4STeam/linux branch
#   testing, carries AccECN, sch_dualpi2 and TCP Prague -- it is NOT
#   the same thing and is not a BBRv3 tree: google's BBRv3 contains no
#   ECT(1), AccECN or Prague support at all.
#
#   No Fedora route. F44 ships mainline kernels, so BBRv3 means either
#   a self-built kernel or a third-party COPR, i.e. owning kernel
#   updates by hand. That cost is the reason this section is inert
#   rather than a plan.
#
# TEST -- BBRv3 registers under the same module name as BBRv1 ("bbr"),
# so `sysctl net.ipv4.tcp_congestion_control` cannot tell them apart:
#
#   modinfo -F version tcp_bbr   # prints "3" on BBRv3, nothing on BBRv1
#
#   (If a custom kernel builds BBR in rather than as a module, the
#   equivalent is `cat /sys/module/tcp_bbr/version`.)
#
# IF BBRv3 BECOMES AVAILABLE -- ENABLE:
#
#   Nothing new in this file. The module name stays "bbr", so section
#   1's `-net.ipv4.tcp_congestion_control = bbr` already selects it the
#   moment the v3 module is the one installed. The change is a kernel
#   change, not a sysctl change. Run the test above after the reboot,
#   because a failed custom-kernel install reverts to BBRv1 silently
#   under the same name.
#
# AT THE SAME TIME -- DISABLE / REVERT:
#
#   net.ipv4.tcp_ecn -> back to 2          [ACTIVELY COUNTERPRODUCTIVE]
#       This is the one setting BBRv3 genuinely conflicts with, and the
#       reason is specific. BBRv3 adds sender-side CE handling
#       (bbr_update_ecn_alpha, bbr_ecn_cut, and an abort path for a
#       startup that is marking too heavily) parameterised by
#       bbr_ecn_factor = 1/3 and bbr_ecn_thresh = 1/2. That is a
#       DCTCP-style PROPORTIONAL response to a high-fidelity mark rate,
#       not the RFC 3168 response of treating one CE like one loss.
#       Two consequences here:
#         - It is gated on bbr_ecn_max_rtt_us, which defaults to 5000
#           (5 ms), described in the source as the "Max RTT at which to
#           use sender-side ECN logic". Every path through the WARP
#           tunnel is far above 5 ms, so on this stack BBRv3's ECN
#           logic is switched off regardless -- requesting Classic ECN
#           outbound would buy nothing it does not already buy, while
#           still costing the fallback handshake.
#         - On the paths where it does engage (loopback, LAN, an
#           unusually near edge), a Classic-ECN bottleneck marks at a
#           deep RED-style threshold. Feeding that low, coarse mark
#           rate into a response calibrated for L4S-grade feedback
#           makes BBRv3 UNDER-react to real congestion. Wrong signal
#           into the wrong response.
#       Going the other way is not an answer either: 3 (AccECN) buys
#       nothing, because google's BBRv3 has no AccECN or ECT(1) code.
#       BBRv3 declares TCP_CONG_WANTS_CE_EVENTS but deliberately NOT
#       TCP_CONG_NEEDS_ECN, so it never forces ECN on -- leaving
#       tcp_ecn at 2 is fully supported, not a workaround.
#
#   net.ipv4.tcp_slow_start_after_idle = 0 -> optional        [REDUNDANT]
#       Already close to inert under BBRv1 for the reason given in
#       section 2, and no more meaningful under BBRv3: cwnd comes from
#       the model, so tcp_cwnd_restart()'s reduction is overwritten
#       within about an RTT. Redundant, NOT counterproductive -- keep
#       the line for the cubic fallback path unless the whole fallback
#       story changes.
#
# UNAFFECTED -- do not touch any of these when BBRv3 arrives:
#
#   net.core.default_qdisc = fq
#       Not redundant, and this is the usual mistake. BBR of any
#       version only publishes a rate into sk_pacing_rate; something
#       still has to enforce it. With fq that is the qdisc. Without fq
#       it falls to TCP's internal pacing timer, which is coarser and
#       bursts more. BBRv3 leans on pacing at least as hard as BBRv1,
#       so fq stays. (An L4S bottleneck would want sch_dualpi2 -- at
#       the BOTTLENECK. This host is not the bottleneck, which is the
#       same argument section 1 already makes for dropping CoDel here.)
#
#   net.ipv4.tcp_notsent_lowat = 131072
#       Orthogonal. It governs how much the application may park in the
#       socket before poll() stops reporting writability -- upstream of
#       anything any congestion controller does. BBRv3 changes neither
#       the direction nor the magnitude of that effect.
#
#   Sections 4, 5, 6 and 7 -- MTU probing, buffer ceilings, keepalives
#   and thin-stream timeouts are all independent of the congestion
#   controller.

# ---------------------------------------------------------------------
# Deliberately NOT set (checked against the baseline, left alone)
# ---------------------------------------------------------------------
# The previous revision claimed this list had been checked against the
# baseline. It had not been checked exhaustively: tcp_limit_output_bytes
# was missing despite interacting directly with TSQ, pacing and
# notsent_lowat, and so was every other pacing- and TSO-adjacent key.
# The entries below now cover the keys in the baseline that a reader
# could reasonably expect this file to have an opinion about.
#
# tcp_rmem -- MOVED. Now set in section 5; see the reasoning there.
#     The old rationale ("already set downstream") did not survive
#     verification against 7.2.
#
# tcp/udp_mem, *_hash_entries, tcp_max_orphans, tcp_max_tw_buckets,
# conntrack sizing and counters
#     the kernel sizes these from each machine's RAM and layout at
#     boot. Copying them between hosts is how configs rot.
#
# tcp_limit_output_bytes -- baseline 4194304, and 4194304 is also the
# v7.2 upstream default
#     The TCP Small Queues ceiling: the cap on bytes this socket may
#     have outstanding in the qdisc and device. It is worth being
#     explicit about why it is left alone, because the obvious guess is
#     wrong in both directions.
#     In v7.2 tcp_small_queue_check() computes
#       limit = max(2 * skb->truesize, sk_pacing_rate >> sk_pacing_shift)
#       limit = min(limit, tcp_limit_output_bytes)
#     Older kernels applied the sysctl only when the socket was NOT
#     paced; that guard is gone, so with fq and BBR the sysctl does
#     still apply. It just never binds: the pacing term is roughly one
#     millisecond of the socket's pacing rate (default shift 10), so
#     4 MiB would only become the smaller of the two above roughly
#     32 Gbit/s of single-flow pacing rate. Nowhere near this stack.
#     Lowering it would bind, and would throttle exactly the high-BDP
#     uploads section 5 just made room for. Raising it changes nothing.
#     Separately: it is not a substitute for notsent_lowat and does not
#     overlap it. TSQ limits bytes already handed DOWN to the qdisc;
#     notsent_lowat limits bytes the application may queue UP in the
#     socket. Section 2 owns the second, the kernel owns the first.
#
# tcp_allowed_congestion_control -- baseline "reno cubic"
#     Self-maintaining, and only ever gated unprivileged
#     setsockopt(TCP_CONGESTION). Full reasoning in section 1. Writing
#     it would be actively harmful: tcp_set_allowed_congestion_control()
#     CLEARS TCP_CONG_NON_RESTRICTED on every algorithm not named, so a
#     stale list in this file would quietly revoke whatever the next
#     kernel adds.
#
# tcp_pacing_ca_ratio (120) / tcp_pacing_ss_ratio (200)
#     Both kernel defaults. They scale the pacing rate the TCP stack
#     DERIVES from cwnd/srtt -- which is the path taken only when the
#     congestion controller does not publish a rate itself. BBR always
#     publishes its own. Changing these would be a no-op for every flow
#     on this host except ones that fell back to cubic.
#
# tcp_autocorking (1)
#     Kernel default, and the temptation is to switch it off for
#     latency: it delays a small write when a previous packet for the
#     flow is still queued, coalescing the two. On a laptop the
#     coalescing is worth more than the microseconds -- fewer packets
#     is less radio time and less CPU. Applications that genuinely care
#     have TCP_CORK and TCP_NODELAY.
#
# tcp_min_tso_segs (2) / tcp_tso_rtt_log (9) / tcp_tso_win_divisor (3)
#     TSO sizing. All kernel defaults, all auto-scaling with rate and
#     RTT since the tso_rtt_log work. The tun does not do hardware TSO
#     anyway; the inner segments are built by the stack and handed to
#     the QUIC encapsulator. Nothing to win.
#
# tcp_adv_win_scale (1)
#     Documented as "Obsolete since linux-6.6" in v7.2 ip-sysctl.rst --
#     receive-buffer overhead accounting is derived from measured
#     truesize now. The key still exists and still accepts writes,
#     which is exactly why it is worth naming here: setting it looks
#     like tuning and does nothing.
#
# tcp_moderate_rcvbuf (1) / tcp_app_win (31)
#     Receive autotuning, on and correctly sized. Section 5 raises the
#     ceiling autotuning may grow into; turning autotuning itself off
#     or reshaping its reserve would defeat that.
#
# tcp_rcvbuf_low_rtt (1000)
#     Relaxes receive-buffer autotuning growth for flows under 1 ms
#     RTT, trading a few ms of ramp-up for a smaller final buffer.
#     Correct as shipped -- and the only sub-1 ms flows here are
#     loopback DNS to dnscrypt-proxy, which never needs a large buffer.
#
# tcp_recovery (0x1) / tcp_frto (2) / tcp_early_retrans (3)
#     RACK loss detection, F-RTO and early retransmit, all on at their
#     kernel defaults. This is the right stack for a lossy, jittery,
#     occasionally reordering tunnel and none of it needs help. Note
#     that clearing tcp_recovery's 0x1 bit does nothing on 7.2 -- the
#     documentation says RACK is the only supported loss detection
#     algorithm.
#
# tcp_no_metrics_save (0) / tcp_no_ssthresh_metrics_save (1)
#     Route metric caching stays on, but ssthresh caching is already
#     off. Cached ssthresh is the part that hurts a roaming laptop --
#     it carries a congestion estimate from one underlying network onto
#     the next. Fedora's shipped combination has this right.
#
# tcp_min_rtt_wlen (300)
#     Kernel default, 5 minutes of min-RTT filter window. Shortening it
#     is tempting for a machine that changes networks, but BBR keeps
#     its own 10-second min-RTT filter and does not consult this, so
#     the change would only move RACK's reordering window around.
#
# tcp_fastopen -- baseline 1, the upstream default
#     client-side TFO is already on; 3 only adds a server role, and
#     browsers dropped TFO anyway.
#
# rmem_default / wmem_default -- baseline 212992 each
#     WARP, dnscrypt-proxy and browsers all call setsockopt; the maxima
#     in section 5 are the gate that matters.
#
# netdev_max_backlog (1000) / netdev_budget (300) /
# netdev_budget_usecs (2000) / gro_normal_batch (8)
#     All kernel defaults, and the usual "tunnel host needs a deeper
#     backlog" reasoning does NOT apply here. The per-CPU backlog queue
#     that netdev_max_backlog sizes is only used by devices that call
#     netif_rx(). drivers/net/tun.c at v7.2 delivers through
#     netif_receive_skb() on the default path (tun_rx_batched() with
#     rx_batched = 0), so inner tunnel traffic bypasses the backlog
#     entirely. Loopback does use it -- but the only loopback traffic
#     here is DNS to dnscrypt-proxy, which will not approach 1000
#     queued packets. The physical NICs use NAPI and bypass it too.
#     Raising it would buy nothing measurable and would deepen a queue
#     under a CPU that is already behind.
#
# qdisc_max_burst (1000)
#     Kernel default. Caps the temporary lockless queue packets sit in
#     before reaching the qdisc proper, so that overload can be dropped
#     before taking a lock. Nothing here calls for changing it.
#
# somaxconn (4096) / tcp_max_syn_backlog (2048) / optmem_max (81920)
#     Listen-side and ancillary-buffer sizing. No server role; nothing
#     on these machines accepts inbound connections from the network.
#
# tcp_plb_enabled (0) and the tcp_plb_* family
#     Protective Load Balancing repaths flows that see persistent
#     congestion by rehashing the ECMP tuple. That needs a multipath
#     datacentre fabric to repath INTO. Behind a single tunnel there is
#     exactly one path.
#
# tcp_shrink_window (0)
#     Leaves the offered receive window un-shrinkable, the safe RFC
#     1122 behaviour. Enabling it only matters when autotuning needs to
#     claw back memory from a window it already advertised, which the
#     32 MiB ceiling in section 5 makes a non-event here.
#
# mptcp.enabled (1)
#     On by default and left on. It costs nothing idle, and nothing on
#     this stack requests MPTCP sockets; WARP presents a single tunnel
#     anyway, so there is no second path to schedule over.
#
# ip_local_port_range -- baseline 32768 60999
#     ~28k ephemeral ports is ample even for segmented downloads.
#     Widening it down toward 1024 invites bind collisions with local
#     services.
#
# tcp_syn_retries (6) / tcp_syn_linear_timeouts (4)
#     Connection-setup timing, not throughput. Lowering syn_retries
#     shortens the worst-case connect stall, but it also gives up on
#     genuinely slow paths, and the tunnel's own reconnect behaviour
#     already dominates that experience. Not this file's business.
#
# tcp_rto_min_us / tcp_rto_max_ms -- baseline 200000 / 120000
#     lowering the minimum RTO risks spurious retransmits on Wi-Fi
#     jitter; not worth it for a client. Section 7 addresses the same
#     stall from the backoff side instead, which is the safer half.
#
# udp_rmem_min / udp_wmem_min -- baseline 4096 each
#     these only matter under udp_mem pressure, which RAM-sized udp_mem
#     makes unreachable here.
#
# busy_poll / busy_read -- baseline 0 each
#     latency bought with CPU; the wrong trade for a laptop.
#
# rp_filter / src_valid_mark -- baseline rp_filter = 2 (loose) on
# conf.default and per-interface, 0 on conf.all; src_valid_mark = 0
#     already tunnel-friendly, and WARP sets its own marks.
#
# net.ipv6.* -- baseline disable_ipv6 = 0 everywhere
#     fully enabled on purpose. WARP provides clean v6; disabling it is
#     the one popular "bypass" move that is purely a downgrade.
#
# ipv6.auto_flowlabels (1)
#     On by default. Gives every flow a distinct IPv6 flow label, which
#     is what lets ECMP hashing see the outer QUIC flows as separate.
#     Nothing to gain by touching it.
#
# tcp_ecn_option (2) / tcp_ecn_option_beacon (3)
#     these control how often AccECN options are sent once AccECN has
#     been negotiated, so they do nothing at any tcp_ecn below 3. Both
#     are the kernel's own defaults, confirmed against v7.2. See
#     section 3.

# ---------------------------------------------------------------------
# VERIFY (apply now, then re-check after a FULL reboot for tuned wins)
# ---------------------------------------------------------------------
#   sudo sysctl -p /etc/sysctl.d/99-net-transport-optimization.conf
#   sudo dracut --force
#   # after reboot -- if any value regressed, tuned's profile owns it:
#   sysctl net.core.default_qdisc net.ipv4.tcp_congestion_control \
#          net.ipv4.tcp_slow_start_after_idle net.ipv4.tcp_notsent_lowat \
#          net.ipv4.tcp_ecn \
#          net.ipv4.tcp_mtu_probing net.ipv4.tcp_mtu_probe_floor \
#          net.core.rmem_max net.core.wmem_max \
#          net.ipv4.tcp_wmem net.ipv4.tcp_rmem \
#          net.ipv4.tcp_keepalive_time net.ipv4.tcp_keepalive_intvl \
#          net.ipv4.tcp_keepalive_probes \
#          net.ipv4.tcp_thin_linear_timeouts
#   tc qdisc show   # fq on ethernet + CloudflareWARP tun;
#                   # "noqueue" on Wi-Fi is mac80211's own fq_codel
#
#   # section 1, no write needed -- should read "reno cubic bbr" once
#   # bbr is the default:
#   sysctl net.ipv4.tcp_allowed_congestion_control
#
#   # section 8 -- expected to print nothing on a stock Fedora kernel:
#   modinfo -F version tcp_bbr
#
#   # section 5, settles the tcp_wmem provenance question one way or
#   # the other (no output = nothing configures it, kernel computed it):
#   grep -rn tcp_wmem /usr/lib/sysctl.d /etc/sysctl.d /run/sysctl.d \
#                     /usr/lib/tuned /etc/tuned
