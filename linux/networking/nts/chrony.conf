# Purpose:   Authenticated time synchronization. Every source uses Network
#            Time Security (NTS) and none of them smear leap seconds.
# Scope:     The chronyd daemon.
# Requires:  chrony 4.6 or later, working DNS for the server names below, and
#            a roughly correct clock at boot. See driftfile here and the -s
#            option in chronyd's startup options.
# Reference: chrony.conf(5).
#
# The sources are chosen for variety of operator, network path, and stratum.
# No Asian national time service offers NTS, so Cloudflare's anycast network
# is the only source here with nearby points of presence in that region. The
# rest are European institutions reached over unicast.

# Cloudflare, global anycast, stratum 3. It has the widest anycast footprint
# of any NTS source, so it is usually the lowest-latency source here.
server time.cloudflare.com iburst nts

# TimeNL, run by SIDN Labs, the .nl registry. Unicast, stratum 1. These two
# hosts also belong to the NTP Pool, but they are named servers with a known
# operator rather than anonymous pool members.
server ntppool1.time.nl iburst nts
server ntppool2.time.nl iburst nts

# PTB, the German national metrology institute. Unicast, stratum 1.
server ptbtime1.ptb.de iburst nts

# Netnod, anycast with all nodes in Sweden, stratum 1.
server nts.netnod.se iburst nts

# Never select a source that is not authenticated. The packaged default
# sourcedir /run/chrony-dhcp is left out on purpose as well, so servers
# offered by DHCP are never loaded.
authselectmode require

# Wait for at least two sources to agree before adjusting the clock.
minsources 2

# Ignore certificate start and expiry dates until the clock has been
# corrected once, so the first key exchange does not fail when the hardware
# clock is wrong. This applies only to chronyd's own TLS connections.
nocerttimecheck 1

# Keep NTS cookies and keys across restarts to skip the key exchange. This
# does not remove the need to resolve the server names above.
ntsdumpdir /var/lib/chrony

# Record how fast the clock gains or loses time. chronyd -s also uses this
# file's modification time as the earliest possible time after a cold boot.
driftfile /var/lib/chrony/drift

# During the first three updates, step the clock instead of slewing it if it
# is more than one second out.
makestep 1.0 3

# Use the official leap second table shipped with tzdata. Leap seconds are
# applied by the kernel as a step, never slewed or smeared.
leapseclist /usr/share/zoneinfo/leap-seconds.list

# Periodically copy the corrected system time back to the hardware clock.
rtcsync

# Directory for chronyd's log files.
logdir /var/log/chrony
