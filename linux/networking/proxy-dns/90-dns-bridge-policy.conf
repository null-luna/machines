# Purpose:   Run systemd-resolved as a plain forwarder in front of
#            dnscrypt-proxy.
# Scope:     The systemd-resolved daemon.
# Requires:  dnscrypt-proxy listening on 127.0.0.1:53.
# Reference: resolved.conf(5), [Resolve] section.
#
# Path of a query: application -> stub listener on 127.0.0.53 -> resolved ->
# dnscrypt-proxy on 127.0.0.1:53. Encryption, choice of upstream provider,
# and signature validation are all left to dnscrypt-proxy.
#
# References
#   DNS                  RFC 1034, RFC 1035
#   Terminology          RFC 9499 (obsoletes RFC 8499)
#   Privacy              RFC 9076
#   DNSSEC               RFC 9364, which covers RFC 4033, 4034, and 4035
#   DNS over HTTPS       RFC 8484
#   DNS over TLS         RFC 7858, with usage profiles in RFC 8310
#   DNS over QUIC        RFC 9250
#   LLMNR                RFC 4795 (Informational, never standards-track)
#   Multicast DNS        RFC 6762, with service discovery in RFC 6763
#   Special-use names    RFC 6761
#   Loopback addresses   RFC 1122 section 3.2.1.3, RFC 6890 (updated by
#                        RFC 8190)
#
# DNSCrypt itself is not an IETF protocol and has no RFC.

[Resolve]

# The only upstream: dnscrypt-proxy's loopback listener. Using IPv4 loopback
# here says nothing about IPv6 upstream; dnscrypt-proxy decides which
# resolvers and which address family to use. This address also stays clear of
# the local proxies that commercial VPN clients and WireGuard setups start.
DNS=127.0.0.1

# Clear the built-in fallback servers so resolution fails instead of quietly
# falling back to plaintext DNS when dnscrypt-proxy is down.
FallbackDNS=

# Route every query to the server above, whatever link it came in on.
Domains=~.

# The hop to 127.0.0.1 never leaves the host, so it stays plaintext.
DNSOverTLS=no

# Do not validate signatures locally. Validation happens upstream, in
# dnscrypt-proxy, which avoids resolution failures at boot when the hardware
# clock is wrong.
DNSSEC=no

# Turn off local multicast name resolution to reduce attack surface.
LLMNR=no
MulticastDNS=no

# Keep the stub listener running for applications and for the connectivity
# checks that VPN clients perform.
DNSStubListener=yes
