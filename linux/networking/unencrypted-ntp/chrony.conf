# Purpose:   Unauthenticated time synchronization. Every source hides leap
#            seconds behind a 24-hour linear smear running from 12:00 UTC
#            to 12:00 UTC, centred on the leap itself.
# Scope:     The chronyd daemon.
# Requires:  chrony 4.0 or later for authselectmode, working DNS for the
#            server names below, and a roughly correct clock at boot. See
#            driftfile here and the -s option in chronyd's startup options.
# Reference: chrony.conf(5).
#
# This is an alternative to ../nts/chrony.conf, not a companion to it.
# Install one or the other. Nothing below is authenticated, so anything on
# the network path can forge these replies; that is the price paid for the
# smear, since no NTS source smears.
#
# Every source must smear, and every source must smear the same way. Inside
# the window a smeared server is deliberately up to one second away from
# UTC, so mixing one with a non-smearing server leaves chronyd holding two
# irreconcilable versions of the time: it will mark a source a falseticker
# or fail to select any source at all. Google and Amazon publish the same
# noon-to-noon linear smear, which is the reason these two can sit together
# and the reason nothing else is added here.

# Google Public NTP, global anycast.
server time.google.com iburst

# Amazon Time Sync Service, global anycast. Publicly reachable, not only
# from inside AWS.
server time.aws.com iburst

# Neither source supports NTS or a symmetric key, so authentication status
# carries no information and is left out of source selection entirely.
# Anything stricter would leave chronyd with nothing it is allowed to pick.
# The packaged default sourcedir /run/chrony-dhcp is still left out on
# purpose, and matters more here than it did under NTS: a server handed out
# by DHCP would almost certainly not smear, and one non-smearing source is
# enough to break selection during a smear window.
authselectmode ignore

# One agreeing source is enough to adjust the clock. This follows from
# having only two servers rather than from dropping NTS: demanding that
# both agree would leave the clock undisciplined whenever either one is
# unreachable. The cost is that a single forged source can steer the clock,
# and without authentication nothing here would detect that.
minsources 1

# Never apply a leap second locally. The servers above absorb the leap into
# their smear and do not announce one, so a correction made here would put
# a second of error into a clock that is already right. This is also why no
# leapseclist is set: the tzdata table must not be consulted.
leapsecmode ignore

# Record how fast the clock gains or loses time. chronyd -s also uses this
# file's modification time as the earliest possible time after a cold boot.
driftfile /var/lib/chrony/drift

# During the first three updates, step the clock instead of slewing it if it
# is more than one second out.
makestep 1.0 3

# Periodically copy the corrected system time back to the hardware clock.
rtcsync

# Directory for chronyd's log files.
logdir /var/log/chrony

# Deliberately not set: maxslewrate. Spreading one second over 24 hours is
# a rate of about 11.6 ppm, far below the 83333.333 ppm default, so chronyd
# tracks the smear at its normal slew rate with no help.
